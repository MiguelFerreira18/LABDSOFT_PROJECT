on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

name: release-please

jobs:
  lintFrontEnd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up node.js 20.11
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Version Bump
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: ./public/android/app/build.gradle
          versionCode: ${{ github.run_number }}

      - name: Install Ionic
        run: npm install -g @ionic/cli
        working-directory: ./

      - name: Install dependencies
        run: npm install
        working-directory: ./public

      - name: Sync ionic in production
        run: ionic cap sync
        working-directory: ./public

      - name: Give gradlew execution permission
        run: chmod +x gradlew
        working-directory: ./public/android

      - name: Check for Gradle wrapper JAR
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper JAR not found. Regenerating wrapper..."
            ./gradlew wrapper
          fi
        working-directory: ./public/android

      - name: Build debug release with gradle
        run: ./gradlew assembleDebug
        working-directory: ./public/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ./public/android/app/build/outputs/apk/debug
